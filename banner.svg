<svg width="960" height="230" viewBox="0 0 960 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 1; r: 4; }
      50% { opacity: 0.45; r: 5.5; }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes dashFlow {
      0% { stroke-dashoffset: 48; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatSoft {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    .pulse { animation: pulseDot 2.2s ease-in-out infinite; }
    .cursor { animation: blinkCursor 1.1s step-end infinite; }
    .flow { stroke-dasharray: 6 6; animation: dashFlow 2.6s linear infinite; }
    .float-card { animation: floatSoft 5s ease-in-out infinite; }
  </style>

  <defs>
    <linearGradient id="bgMain" x1="0" y1="0" x2="960" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1324"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <radialGradient id="glowIndigo" cx="18%" cy="20%" r="48%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="82%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowEmerald" cx="55%" cy="15%" r="35%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="40" y1="60" x2="360" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="barGrad" x1="40" y1="0" x2="340" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0" y1="0" x2="960" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.45"/>
    </linearGradient>

    <pattern id="gridPattern" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Base Frame -->
  <rect x="0.75" y="0.75" width="958.5" height="228.5" rx="16" fill="url(#bgMain)" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <rect x="1.5" y="1.5" width="957" height="227" rx="15" fill="url(#gridPattern)"/>
  <rect x="1.5" y="1.5" width="957" height="227" rx="15" fill="url(#glowIndigo)"/>
  <rect x="1.5" y="1.5" width="957" height="227" rx="15" fill="url(#glowCyan)"/>
  <rect x="1.5" y="1.5" width="957" height="227" rx="15" fill="url(#glowEmerald)"/>

  <!-- Animated Subtle Connector Arcs -->
  <path class="flow" d="M 465 115 C 510 115, 520 72, 575 72" stroke="#6366f1" stroke-width="1.4" stroke-opacity="0.55" fill="none"/>
  <path class="flow" d="M 465 135 C 515 135, 525 162, 575 162" stroke="#10b981" stroke-width="1.4" stroke-opacity="0.5" fill="none"/>

  <!-- Top Terminal Pill -->
  <rect x="38" y="24" width="295" height="26" rx="13" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <circle class="pulse" cx="55" cy="37" r="4" fill="#10b981"/>
  <text x="68" y="41" fill="#94a3b8" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5" font-weight="600">
    ~/ensibey · building AI systems
  </text>

  <!-- Hero Title -->
  <text x="38" y="106" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
    Enis Doğan
  </text>
  <rect class="cursor" x="282" y="72" width="3.5" height="36" rx="1.5" fill="#38bdf8"/>

  <!-- Gradient Accent Bar -->
  <rect x="38" y="120" width="310" height="3" rx="1.5" fill="url(#barGrad)"/>

  <!-- Subtitle -->
  <text x="38" y="150" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    Software Engineering Student · Local RAG, Multi-Agent Systems &amp; Security Tooling
  </text>

  <!-- Highlight Chips -->
  <g transform="translate(38, 168)">
    <rect x="0" y="0" width="144" height="26" rx="7" fill="#6366f1" fill-opacity="0.16" stroke="#818cf8" stroke-opacity="0.4"/>
    <text x="12" y="17" fill="#c7d2fe" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="600">🛡️ AST &amp; SARIF 2.1</text>

    <rect x="154" y="0" width="136" height="26" rx="7" fill="#0ea5e9" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="166" y="17" fill="#bae6fd" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="600">🔒 Air-Gapped RAG</text>

    <rect x="300" y="0" width="132" height="26" rx="7" fill="#10b981" fill-opacity="0.15" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="312" y="17" fill="#a7f3d0" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="600">🤖 LangGraph Agents</text>
  </g>

  <!-- Right Glassmorphic Code & System Card -->
  <g class="float-card" transform="translate(575, 26)">
    <rect x="0" y="0" width="346" height="178" rx="12" fill="#0b1120" fill-opacity="0.92" stroke="#334155" stroke-width="1.2"/>
    <!-- Window dots -->
    <circle cx="18" cy="18" r="4" fill="#ef4444" fill-opacity="0.85"/>
    <circle cx="32" cy="18" r="4" fill="#f59e0b" fill-opacity="0.85"/>
    <circle cx="46" cy="18" r="4" fill="#10b981" fill-opacity="0.85"/>
    <text x="64" y="21.5" fill="#64748b" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5">
      architecture.py — ensibey
    </text>
    <line x1="0" y1="34" x2="346" y2="34" stroke="#1e293b" stroke-width="1"/>

    <!-- Code lines -->
    <text x="16" y="56" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">
      <tspan fill="#c084fc">class</tspan> <tspan fill="#38bdf8" font-weight="700">EnisAIStack</tspan><tspan fill="#94a3b8">:</tspan>
    </text>
    <text x="28" y="77" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">
      <tspan fill="#94a3b8">agents</tspan>    <tspan fill="#64748b">=</tspan> <tspan fill="#34d399">["LangGraph", "AST", "Judge"]</tspan>
    </text>
    <text x="28" y="98" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">
      <tspan fill="#94a3b8">retrieval</tspan> <tspan fill="#64748b">=</tspan> <tspan fill="#38bdf8">["BM25", "Qdrant", "Chroma"]</tspan>
    </text>
    <text x="28" y="119" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">
      <tspan fill="#94a3b8">models</tspan>    <tspan fill="#64748b">=</tspan> <tspan fill="#fbbf24">["Ollama", "PyTorch", "Llama 3"]</tspan>
    </text>
    <text x="28" y="140" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">
      <tspan fill="#94a3b8">systems</tspan>   <tspan fill="#64748b">=</tspan> <tspan fill="#f472b6">["Python", "C++", "FastAPI"]</tspan>
    </text>
    <text x="16" y="162" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" fill="#64748b">
      # status: shipping open-source AI &amp; security tools
    </text>
  </g>
</svg>
